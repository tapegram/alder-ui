<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>al-input</title>
<link rel="stylesheet" href="../al.css">
<script>
function toggleTheme() { var r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; r.dataset.theme = dark ? "light" : "dark"; }
</script>
</head>
<body>
<al-page>
<al-stack gap="lg">
<al-stack direction="row" gap="sm">
  <a href="index.html">alder-ui demos</a>
  <al-button variant="outline" size="sm"><button type="button" onclick="toggleTheme()">Toggle theme</button></al-button>
</al-stack>
<h1>al-input</h1>
<p>The markup Alder renders for <code>&lt;al-input field="title" label="Title" /&gt;</code>: a real <code>&lt;label&gt;</code> around the input, then the <code>ul.errors</code> list. <code>help</code> is drawn from the attribute; <code>invalid</code> colours the border.</p>
<section>
<h2>Default</h2>
<al-input label="Title" placeholder="A short title"><label>Title<input name="title" type="text" required placeholder="A short title"></label><ul class="errors" data-errors="title"></ul></al-input>
</section>

<section>
<h2>With help</h2>
<al-input label="Email" help="We never share it."><label>Email<input name="email" type="email" required></label><ul class="errors" data-errors="email"></ul></al-input>
</section>

<section>
<h2>Invalid</h2>
<al-input label="Title" invalid><label>Title<input name="title" type="text" required></label><ul class="errors" data-errors="title"><li>must not be empty</li></ul></al-input>
</section>

<section>
<h2>Disabled</h2>
<al-input label="Slug" disabled><label>Slug<input name="slug" type="text" value="hello-world" disabled></label><ul class="errors" data-errors="slug"></ul></al-input>
</section>

</al-stack>
</al-page>
</body>
</html>
